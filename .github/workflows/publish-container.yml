# Generated by scripts/container_workflow.py using scitrera-repo-tools.
# Edit versions.yaml and run make ci; make check-metadata checks for drift.
# Job definitions below are emitted verbatim by repo-tools' Docker generator.
name: Publish container
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  build-scitrera-auth-go-linux-amd64:
    name: Build scitrera-auth-go (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version scitrera-auth-go)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/scitrera-auth-go
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/scitrera/scitrera-auth-go,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.imgver.outputs.version }}
          cache-from: type=gha,scope=scitrera-auth-go-linux-amd64
          cache-to: type=gha,mode=max,scope=scitrera-auth-go-linux-amd64
  build-scitrera-auth-go-linux-arm64:
    name: Build scitrera-auth-go (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version scitrera-auth-go)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/scitrera-auth-go
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/scitrera/scitrera-auth-go,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.imgver.outputs.version }}
          cache-from: type=gha,scope=scitrera-auth-go-linux-arm64
          cache-to: type=gha,mode=max,scope=scitrera-auth-go-linux-arm64
  merge-scitrera-auth-go:
    name: Merge scitrera-auth-go multi-arch manifest
    runs-on: ubuntu-latest
    needs: [ build-scitrera-auth-go-linux-amd64, build-scitrera-auth-go-linux-arm64 ]
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version scitrera-auth-go)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo $VER | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/scitrera-auth-go
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}

      - name: Create multi-arch manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          eval "docker buildx imagetools create $TAGS \
            ghcr.io/scitrera/scitrera-auth-go@${{ needs.build-scitrera-auth-go-linux-amd64.outputs.digest }} \
            ghcr.io/scitrera/scitrera-auth-go@${{ needs.build-scitrera-auth-go-linux-arm64.outputs.digest }}"
