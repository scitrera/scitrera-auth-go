name: Prepare review artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    uses: ./.github/workflows/test-go.yml
  npm:
    uses: ./.github/workflows/test-npm.yml
  integration:
    uses: ./.github/workflows/ci.yml
  artifacts:
    needs: [go, npm, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install build tools
        run: uv tool install scitrera-repo-tools==0.1.30
      - name: Prepare versioned Linux binaries and source
        run: make artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: scitrera-auth-review-artifacts
          path: dist/
          if-no-files-found: error
      # Publication is intentionally a separate reviewed action: no tags,
      # releases, registry pushes or deployment are performed by this workflow.
