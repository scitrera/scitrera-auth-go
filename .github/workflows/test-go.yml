# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Test (Go)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-scitrera-auth-go:
    name: Test scitrera-auth-go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: auth
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U auth -d auth" --health-interval 2s --health-retries
          30
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      AUTH_TEST_POSTGRES_DSN: postgres://auth:local-ci-only@127.0.0.1:5432/auth?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
          cache-dependency-path: ./go.sum

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l cmd internal)"
        working-directory: .


      - name: go vet
        run: go vet ./...
        working-directory: .

      - name: go test
        run: go test -race -count=1 -timeout=10m ./...
        working-directory: .
