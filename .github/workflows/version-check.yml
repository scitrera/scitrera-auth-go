name: Version Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'cmd/scitrera-auth-proxy/commands.go'
      - 'go.mod'
      - 'versions.yaml'
      - 'web/package.json'

permissions:
  contents: read

jobs:
  check:
    name: sync-versions --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify versions are in sync
        run: uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --check --verbose

      - name: Verify generated workflows
