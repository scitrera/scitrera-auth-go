# Example only: replace auth/backend upstream addresses and provision TLS.
# This tenant location is trusted configuration, not a client-selected tenant.
server {
  listen 8088;
  server_name app.example.com;
  location = /_auth_alpha {
    internal;
    proxy_pass http://auth:8080/auth/verify?workspace_id=auth-app&tenant_id=alpha;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Workspace-ID "";
  }
  location /alpha/ {
    auth_request /_auth_alpha;
    # Only explicitly listed headers reach the application. Add ordinary
    # application headers deliberately; never forward client identity headers.
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Type $http_content_type;
    auth_request_set $auth_user $upstream_http_x_scitrera_user;
    auth_request_set $auth_tenant $upstream_http_x_scitrera_default_tenant;
    auth_request_set $auth_tenants $upstream_http_x_scitrera_tenants;
    auth_request_set $auth_name $upstream_http_x_scitrera_name;
    auth_request_set $auth_type $upstream_http_x_auth_principal_type;
    auth_request_set $auth_identity $upstream_http_x_auth_user_id;
    proxy_set_header X-Scitrera-User $auth_user;
    proxy_set_header X-Scitrera-Default-Tenant $auth_tenant;
    proxy_set_header X-Scitrera-Tenants $auth_tenants;
    proxy_set_header X-Scitrera-Name $auth_name;
    proxy_set_header X-Auth-User-ID $auth_identity;
    proxy_set_header X-Auth-Tenant-ID $auth_tenant;
    proxy_set_header X-Auth-Principal-Type $auth_type;
    proxy_set_header X-Auth-Authority "";
    proxy_pass http://application:3000/;
  }
}
