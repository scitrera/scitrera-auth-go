# SPDX-License-Identifier: AGPL-3.0-only
# Canonical product version. Run make versions && make ci after editing.
scitrera-auth-go: 0.1.2

project_rules:
  scitrera-auth-go:
    - type: gomod
      path: go.mod
    - type: go_version
      path: cmd/scitrera-auth-proxy/commands.go
    - type: package
      path: web/package.json

go_toolchain:
  go: "1.25.14"

ci:
  test_branches: [main]
  push_branches: [main]
  repo_tools_source: scitrera-repo-tools==0.1.30
  check_generated_ci: true
  # release.yml consumes github_release and builds the embedded UI/source first.
  # make ci wraps repo-tools' Docker jobs as a reusable publish-container workflow
  # so container publication waits for all of release.yml's checks.
  only_workflows: [version-check, test-go, test-npm]
  github_release: true
  go:
    lint: none
    enable_govulncheck: true
    govulncheck_version: v1.3.0
    test_args: -race -count=1 -timeout=10m
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      AUTH_TEST_POSTGRES_DSN: postgres://auth:local-ci-only@127.0.0.1:5432/auth?sslmode=disable
      AUTH_TEST_REDIS_ADDR: 127.0.0.1:6379
    services:
      valkey:
        image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
        ports: [6379:6379]
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: auth
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U auth -d auth" --health-interval 2s --health-retries 30
    setup_steps:
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
  npm:
    node_version: "24.13.0"
    cache: true
    build: true
    lint: none # npm run build includes typecheck.
  docker:
    default_platforms: [linux/amd64, linux/arm64]
    platform_runners:
      linux/amd64: ubuntu-latest
      linux/arm64: ubuntu-24.04-arm
    enable_workflow_dispatch_version: false
    test_prereqs: [] # release.yml gates the reusable workflow on all tests.

docker:
  ghcr: scitrera
  images:
    scitrera-auth-go:
      context: .
      dockerfile: Dockerfile
      version_from: scitrera-auth-go
      build_strategy: native
      build_args:
        VERSION: ${image_version}
        REVISION: ${{ github.sha }}
